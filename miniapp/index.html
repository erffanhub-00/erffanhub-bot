<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ErffanHub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-header">
    <h1>ErffanHub</h1>
    <p id="status" class="status" role="status">در حال بارگذاری…</p>
    <button id="export-btn" class="btn btn-secondary" type="button">خروجی گرفتن (JSON)</button>
  </header>

  <nav class="tabs" aria-label="بخش‌های داشبورد">
    <button class="tab-btn active" type="button" data-tab="news">اخبار</button>
    <button class="tab-btn" type="button" data-tab="drafts">پیش‌نویس‌ها</button>
    <button class="tab-btn" type="button" data-tab="scheduled">زمان‌بندی</button>
  </nav>

  <main>
    <section id="tab-news" class="tab-panel active" aria-label="اخبار">
      <div class="card">
        <p class="hint">گرفتن خبرهای تازه با دستور <code>/news</code> در بات انجام می‌شود؛ اینجا صندوق خبر را می‌بینی.</p>
        <button id="refresh-news-btn" class="btn btn-primary" type="button">گرفتن خبرهای تازه</button>
      </div>
      <div id="news-list" class="list"></div>

      <h2>فیدهای RSS</h2>
      <div id="feeds-list" class="list"></div>
      <form id="add-feed-form" class="card form">
        <label>
          نام فید
          <input id="feed-name" type="text" placeholder="مثلاً زومیت" required>
        </label>
        <label>
          آدرس فید (https)
          <input id="feed-url" type="url" placeholder="https://example.com/feed" dir="ltr" required>
        </label>
        <button class="btn btn-primary" type="submit">افزودن فید</button>
      </form>
    </section>

    <section id="tab-drafts" class="tab-panel" aria-label="پیش‌نویس‌ها" hidden>
      <div id="drafts-list" class="list"></div>
    </section>

    <section id="tab-scheduled" class="tab-panel" aria-label="زمان‌بندی" hidden>
      <h2>زمان‌بندی‌شده‌ها</h2>
      <div id="scheduled-list" class="list"></div>
      <h2>تاریخچه انتشار</h2>
      <div id="published-list" class="list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
